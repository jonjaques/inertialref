# Whether Ubicloud gives Dawn a physical Linux GPU — the Vulkan half of the
# shader suite in CI, run by hand.
#
# `pnpm test:gpu` runs on every pull request as `check.yml`'s `gpu` job, on the
# paravirtual Apple GPU of the hosted macOS runner. That device sees Metal and
# offers no `timestamp-query`. A Linux runner with a real NVIDIA driver would
# add Vulkan — Dawn's other production backend — and the pass timeline, at
# Ubicloud's per-minute GPU rate.
#
# The GPU job waits behind the `UBICLOUD_GPU` repository variable because no
# runner currently answers to `ubicloud-gpu`: Ubicloud's runner-types page
# lists no GPU label, and GitHub leaves a job whose label nothing serves queued
# for a day rather than failing it. The integration job beside it runs on the
# cheapest Ubicloud runner, so a stuck GPU job reads as the label and not the
# app. Set the variable once Ubicloud confirms the fleet is enabled for the
# account, then dispatch this workflow from Actions.

name: gpu-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubicloud:
    name: ubicloud-standard-2 (integration)
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - run: uname -a && nproc && cat /etc/os-release | head -2

  linux:
    name: ubicloud-gpu (Vulkan)
    if: vars.UBICLOUD_GPU == 'true'
    runs-on: ubicloud-gpu
    timeout-minutes: 20

    steps:
      # No LFS: no `*.gpu.test.ts` reads a model or a plate.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # The image carries NVIDIA's driver for CUDA; Vulkan needs the loader and
      # the driver's ICD as well, and a driver installed for compute alone can
      # ship without the second. Both are printed rather than assumed, so a
      # missing ICD reads as that and not as "Dawn found no adapter".
      - name: Driver and Vulkan
        run: |
          nvidia-smi || echo "nvidia-smi: not found"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 vulkan-tools
          ls -l /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || echo "no Vulkan ICD directory"
          vulkaninfo --summary || echo "vulkaninfo: failed"

      # DISPLAY unset: with one set, NVIDIA's Vulkan driver enumerates through
      # the X server, and a runner has none to connect to.
      - name: Adapter
        run: env -u DISPLAY node scripts/gpuAdapter.mjs

      - name: GPU suite
        if: success() || failure()
        run: env -u DISPLAY pnpm test:gpu
