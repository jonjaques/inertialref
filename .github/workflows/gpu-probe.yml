# Whether a Linux runner gives Dawn a physical GPU — the Vulkan half of the
# shader suite in CI, run by hand.
#
# `pnpm test:gpu` runs on every pull request as `check.yml`'s `gpu` job, on the
# paravirtual Apple GPU of the hosted macOS runner. That device sees Metal and
# offers no `timestamp-query`. A Linux runner with a real NVIDIA driver adds
# Vulkan — Dawn's other production backend — and the pass timeline.
#
# The runner is the `LINUX_GPU_RUNNER` repository variable, because none of
# the candidates is a label GitHub serves: each is a third-party provider whose
# app or stack has to be installed first. It is a `format` string, and `{0}`
# becomes the run id, which RunsOn's labels need:
#
#   RunsOn (your AWS)  runs-on={0}/family=g4dn.xlarge/image=ubuntu24-gpu-x64
#   machine.dev        machine/gpu=t4/tenancy=spot
#
# With the variable unset the job is skipped rather than queued: GitHub leaves
# a job whose label nothing serves queued for a day instead of failing it.
# Ubicloud's `ubicloud-gpu` was that label — it removed GPU runners on
# 15 March 2026 (`config/github_runner_labels.yml` in ubicloud/ubicloud).
#
# The images document NVIDIA's CUDA driver and not Vulkan, so the job prints
# the driver, the loader and the ICD before asking Dawn, and the adapter step
# fails on a software device — lavapipe or SwiftShader — rather than letting a
# CPU Vulkan pass for the GPU.

name: gpu-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux GPU (Vulkan)
    if: vars.LINUX_GPU_RUNNER != ''
    runs-on: ${{ format(vars.LINUX_GPU_RUNNER, github.run_id) }}
    timeout-minutes: 20

    steps:
      # No LFS: no `*.gpu.test.ts` reads a model or a plate.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The images carry NVIDIA's driver for CUDA; Vulkan needs the loader and
      # the driver's ICD as well, and a driver installed for compute alone can
      # ship without the second. Both are printed rather than assumed, so a
      # missing ICD reads as that and not as "Dawn found no adapter".
      - name: Driver and Vulkan
        run: |
          nvidia-smi || echo "nvidia-smi: not found"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 vulkan-tools
          ls -l /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || echo "no Vulkan ICD directory"
          vulkaninfo --summary || echo "vulkaninfo: failed"

      # DISPLAY unset: with one set, NVIDIA's Vulkan driver enumerates through
      # the X server, and a runner has none to connect to.
      - name: Adapter
        run: env -u DISPLAY node scripts/gpuAdapter.mjs

      # After a failed adapter step as well, since what the suite says about a
      # refused device is the other half of the answer — but not after a
      # failed install, where it could only fail to resolve its imports.
      - name: GPU suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: env -u DISPLAY pnpm test:gpu
