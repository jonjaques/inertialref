<!--
  The mark, and literally the same three paths as `src/icons/Logomark.tsx`.

  Duplicated rather than imported: a favicon is fetched by the browser as a
  document before any module runs, and `public/` is copied verbatim by Vite. The
  two are kept in step by hand and there is no third copy — the paths are
  reproduced unchanged, with the fit expressed as a transform rather than by
  rewriting the coordinates, so a diff of the two files is a diff of the mark.

  Two things this has that the component does not, both because a tab strip is
  not a surface this design system controls:

    - a slate-950 plate, because half the platforms draw the strip white in
      light mode and an unbacked sky-blue mark vanishes into it
    - a 24-of-32 fit, which is the proportion at which a marque still reads as
      an icon rather than as a sticker with a margin

  The transform: the drawing's bounding box is x 3-30, y 2.5-29.5, so 27 units
  square. 24/27 = 0.8889, and the translation is what re-centres the scaled box
  on (16, 16).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
>
  <rect width="32" height="32" rx="7" fill="#020617" />
  <g transform="translate(1.333 1.778) scale(0.8889)">
    <path d="M12 2.5H30L25 9H7Z" fill="#e0f2fe" />
    <path d="M10 12.75H25.5L20.5 19.25H5Z" fill="#7dd3fc" />
    <path d="M8 23H21L16 29.5H3Z" fill="#0ea5e9" />
  </g>
</svg>
