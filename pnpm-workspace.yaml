packages:
  - 'apps/*'
  - 'packages/*'

# pnpm refuses to run install scripts unless the package is named here, and
# pnpm 11 and later want the decision spelled out per package, not as a list.
# These all ship native binaries and genuinely need their postinstall; workerd is
# the Workers runtime `cf dev` and `cf deploy` execute against, and without its
# postinstall there is no binary to run.
allowBuilds:
  '@tailwindcss/oxide': true
  # sharp is how `apps/ingest` resizes a 21600x10800 GEBCO elevation PNG into a
  # normal map. It is a build-time tool in a build-time app; nothing it produces
  # is imported at runtime, and `packages/*` still depends on nothing.
  sharp: true
  esbuild: true
  oxlint: true
  workerd: true
  # webgpu is Dawn as a Node addon — `pnpm test:gpu`'s device. It ships the
  # binary prebuilt, and its postinstall does one thing: strip the macOS
  # quarantine attribute from `dawn.node`. A registry fetch never sets that
  # attribute (only a browser download does), so the script has nothing to do
  # here and is refused rather than allowed. If the addon ever fails to load
  # with a Gatekeeper message, the fix is `xattr -d com.apple.quarantine` on
  # that file, not flipping this to true.
  webgpu: false
  # core-js arrives with posthog-js. Its postinstall prints a funding banner and
  # builds nothing, and the bundle never loads core-js: posthog-js ships one
  # self-contained module. Undecided, pnpm fails the install on it.
  core-js: false

# The cloud renderer. `three-clouds-webgpu` 0.1.0-alpha.9 is an unofficial
# WebGPU port of @takram/three-clouds that ships as a GitHub release archive,
# not on npm, and it declares three `>=0.187.0 <0.188.0`. The npm builds of the
# two takram packages fail at import on three 0.185 and later (they read
# `struct().layout`, which r185 removed), so the port names its own fork
# builds, release 8, and refuses to load on any other. One copy of each has to
# resolve, because the port's context providers and the atmosphere's nodes
# compare constructors: hence overrides, not two dependencies. SHA-256, from
# the releases' own notes and checked on download:
#   three-clouds-webgpu-0.1.0-alpha.9.tgz        bc7f1ad147ccb8899ceac1a4c6d391c2ff0dba820b9a6ae49423719d524313eb
#   takram-three-atmosphere-0.19.1+fork.8.tgz    829ec23b8754700f93e9764b8473924ac4995c634dccd6e96401f5b944eb34e1
#   takram-three-geospatial-0.9.1+fork.8.tgz     10127715aeb9ac35e7d7e8bf443817d08e9bae845851810d5471628c3b91be25
overrides:
  '@takram/three-atmosphere': https://github.com/johnfewell/three-geospatial/releases/download/fork-release-8/takram-three-atmosphere-0.19.1%2Bfork.8.tgz
  # A file, not the release's URL: geospatial is the atmosphere's own
  # dependency, and pnpm's `blockExoticSubdeps` refuses a tarball URL below the
  # direct dependencies (ERR_PNPM_EXOTIC_SUBDEP). A local file is one of its
  # trusted sources, and the port's own install vendors it for the same reason.
  '@takram/three-geospatial': file:./vendor/takram-three-geospatial-0.9.1+fork.8.tgz

# Upstream fixes three has merged and not yet released, each patched into the
# release we run and deleted with the release that carries it (ADR-0030).
# The game loads `build/three.webgpu.js` and `build/three.tsl.js`, not
# `src/`, so every patch carries its pull request's diff applied to the
# bundles as well as to the sources it was written against.
#
#   three@0.187.0  mrdoob/three.js#35359, merged for r188 as 7d4a7890.
#                  `compileAsync` builds a render object synchronously again.
#                  On r187 two compiles in flight share one precompilation
#                  state, the second throws in `_finishPreCompile` (#35315),
#                  and its pipeline is registered and never built, so the
#                  object it was for draws nothing.
patchedDependencies:
  three@0.187.0: patches/three@0.187.0.patch
